events {
    worker_connections 1024;
}

http {
    # Ports must match the worker base port used by `pnpm start:workers`
    # (package.json) and by gateway/gateway.js (GATEWAY_WORKER_BASE_PORT).
    # Keeping one source of truth avoids proxying to ports nobody listens on.
    upstream dbbemn_backend {
        least_conn;
        server 127.0.0.1:4001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        access_log logs/access.log;
        error_log logs/error.log;

        location / {
            proxy_pass http://dbbemn_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/v1/health/live {
            proxy_pass http://dbbemn_backend/api/v1/health/live;
            access_log off;
        }
    }
}
